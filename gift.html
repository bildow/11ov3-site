<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gift Access — 11ov3</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/js/app.js"></script>
  </head>
  <body class="bg-white text-gray-900">
    <div id="site-header"></div>
    <main class="max-w-4xl mx-auto px-4 py-16">
      <section class="border rounded-xl p-6 bg-white shadow text-center space-y-4">
        <h1 class="text-3xl font-bold">Redeem Your Patronage Gift</h1>
        <p class="text-gray-600">Use the id and code from your receipt. If they match, the gift package appears below. Keep the code private or share only with the intended recipient.</p>
        <div id="giftStatus" class="text-sm text-gray-500"></div>
        <div id="giftLink" class="hidden mt-4"></div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script>
      function getQuery(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }
      async function verifyGift() {
        const id = getQuery('id');
        const code = getQuery('code');
        if (!id || !code) {
          document.querySelector('#giftStatus').textContent = 'Missing gift id or code.';
          return;
        }
        const res = await fetch('/data/gifts.json');
        const gifts = await res.json();
        const match = gifts.find(g => g.id === id && g.code === code);
        if (!match) {
          document.querySelector('#giftStatus').textContent = 'Gift not recognized. Ensure your code matches the deposit receipt.';
          return;
        }
        document.querySelector('#giftStatus').textContent = `You unlocked ${match.title}!`;
        const link = document.querySelector('#giftLink');
        link.classList.remove('hidden');
        link.innerHTML = `<a href="${match.file}" class="px-4 py-2 bg-indigo-600 text-white rounded">Open ${match.title}</a>`;
      }
      document.addEventListener('DOMContentLoaded', verifyGift);
    </script>
  </body>
</html>
